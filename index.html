<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RLEAMS · Robotics Lab Equipment & Asset Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>RLEAMS<small>Robotics Lab Equipment &amp; Asset Management System</small></h1>
  <span id="mode" class="badge">demo mode</span>
</header>
<main>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="Search tag, name, location, person" aria-label="Search">
    <select id="fc" aria-label="Category"></select>
    <select id="fs" aria-label="Status"><option value="">All statuses</option><option>Available</option><option>CheckedOut</option><option>Maintenance</option><option>Retired</option></select>
    <button id="exp">Export CSV</button>
    <button id="scan" class="pri">Scan QR</button>
    <button id="add">Add asset</button>
  </div>
  <div class="wrap"><table><thead><tr><th>Tag</th><th>Asset</th><th>Location</th><th>Status</th><th>Held by</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <h2>Recent activity</h2>
  <ul class="log" id="log"></ul>
</main>

<dialog id="dA"><form method="dialog" id="fA">
  <h3 id="tA">Add asset</h3>
  <div class="row"><div><label for="aTag">Asset tag</label><div class="inl"><input id="aTag" required placeholder="RB-014"><button type="button" id="aScan" title="Scan tag from QR">Scan</button></div></div>
  <div><label for="aCat">Category</label><select id="aCat"></select></div></div>
  <label for="aName">Name</label><input id="aName" required placeholder="UR5e collaborative arm">
  <div class="row"><div><label for="aLoc">Location</label><input id="aLoc" placeholder="Bench 3"></div>
  <div><label for="aSt">Status</label><select id="aSt"><option>Available</option><option>Maintenance</option><option>Retired</option></select></div></div>
  <label for="aNote">Notes</label><textarea id="aNote" rows="2"></textarea>
  <div class="foot"><button type="button" data-close>Cancel</button><button class="pri">Save asset</button></div>
</form></dialog>

<dialog id="dC"><form method="dialog" id="fC">
  <h3 id="tC">Check out</h3>
  <label for="cWho">Person</label><input id="cWho" required placeholder="Name">
  <label for="cDue">Due back</label><input id="cDue" type="date" required>
  <div class="foot"><button type="button" data-close>Cancel</button><button class="pri">Check out</button></div>
</form></dialog>
<dialog id="dS">
  <h3>Scan asset QR</h3>
  <div id="reader"></div>
  <p id="scanMsg" class="hint">Point the camera at an asset QR label.</p>
  <label for="manTag">Or type / use a handheld scanner</label>
  <div class="inl"><input id="manTag" placeholder="Asset tag, then Enter" autocomplete="off"><button id="manGo" class="pri" type="button">Go</button></div>
  <div class="foot"><button type="button" data-close>Close</button></div>
</dialog>

<dialog id="dQ">
  <h3>QR label</h3>
  <div id="qrBox"></div>
  <p class="hint" id="qrCap"></p>
  <div class="foot"><button type="button" data-close>Close</button><button class="pri" id="qrPrint" type="button">Print label</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
